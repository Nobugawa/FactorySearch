[build]
  publish = "."

# Do not serve repo internals from the public site
[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/*.sql"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
